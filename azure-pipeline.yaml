# Playwright Tests Pipeline
# Dokumentation: https://playwright.dev/docs/ci

trigger:
  - none

# Jeden Tag um 8:00 Uhr
schedules:
  - cron: "0 8 * * *"
    displayName: Daily Test Run | Prio 1 | Tenant Baut
    branches:
      include:
        - main
    always: true

variables:
  TEST_DEV_ENV: 0
  emsSystemId: app-qa-bmg-base
  AZURE_ORGANISATION: bmgdigitalsolution
  AZURE_PROJECT: Enginius.Test.Base
  CI: true

pool:
  name: Azure Pipelines
  vmImage: 'windows-2022'

steps:
  # Alte Test-Ergebnisse löschen
  - task: DeleteFiles@1
    inputs:
      SourceFolder: '$(System.DefaultWorkingDirectory)/playwright-report'
      Contents: '**/*'
    displayName: 'Clean old test results'
    continueOnError: true

  # Node.js installieren
  - task: NodeTool@0
    inputs:
      versionSpec: '18.x'
    displayName: 'Install Node.js'

  # Dependencies installieren
  - script: |
      npm install
    displayName: 'npm install'

  # Playwright Browser installieren (nur Chromium, wie in deiner Config)
  - script: |
      npx playwright install chromium --with-deps
    displayName: 'Install Playwright Chromium Browser'

  # Playwright Tests ausführen
  - script: |
      npx playwright test
    continueOnError: true
    env:
      BASE_URL: $(BASE_URL)
      TEST_USER: $(TEST_USER)
      CI: true
    displayName: 'Run Playwright tests'

  # Login
  - script: npx playwright test tests/Login_15.spec.js
    displayName: "Test 1 - Login"


  # Erstellen & Senden (nur wenn Login grün)
  - script: npx playwright test tests/RueckmeldungErstellenUndSenden_4.spec.js
    displayName: "Test 2 - Erstellen und Senden"
    condition: succeeded()


  # Löschen (nur wenn Test 2 grün)
  - script: npx playwright test tests/RueckmeldungLoeschen_13.spec.js
    displayName: "Test 3 - Löschen"
    condition: succeeded()

  # HTML Report publizieren als Artifact
  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: 'playwright-report'
      artifact: 'playwright-html-report-$(emsSystemId)'
      publishLocation: 'pipeline'
    displayName: 'Publish HTML Report'
    condition: always()

  # Test-Ergebnisse als Traces publizieren (für fehlgeschlagene Tests)
  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: 'test-results'
      artifact: 'playwright-traces-$(emsSystemId)'
      publishLocation: 'pipeline'
    displayName: 'Publish test traces'
    condition: failed()